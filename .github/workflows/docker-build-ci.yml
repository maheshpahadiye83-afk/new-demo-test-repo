name: Docker Build CI

# Triggers: Define what events start the pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Environment variables
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Jobs: Define parallel or sequential stages
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    # Pulls the repository code onto the runner machine
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Set up Docker Buildx for advanced build capabilities
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build Docker image
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ env.IMAGE_NAME }}:latest
        outputs: type=docker,dest=/tmp/image.tar

    # Load and test the image locally
    - name: Load Docker image
      run: |
        docker load --input /tmp/image.tar

    # Run basic tests on the image
    - name: Test Docker image
      run: |
        docker run --rm ${{ env.IMAGE_NAME }}:latest python --version
        docker run --rm ${{ env.IMAGE_NAME }}:latest python -m pip list

    # Log in to Container Registry (only on main branch push)
    - name: Log in to Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Push to Container Registry (only on main branch push)
    - name: Push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Scan dependencies for vulnerabilities
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    # Upload results to GitHub Security tab
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
